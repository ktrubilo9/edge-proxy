name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    name: golangci-lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.13

  test:
    name: Go checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Check formatting
        run: test -z "$(gofmt -l .)"

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

      - name: Race detector
        run: go test -race ./...
  e2e:
    name: Health checker E2E
    needs: [lint, test]
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    env:
      ADMIN_API_TOKEN: ci-only-api-token
      ADMIN_GRPC_TOKEN: ci-only-grpc-token

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Show Docker versions
        run: |
          docker version
          docker compose version
          python3 --version

      - name: Build and start test stack
        run: docker compose up -d --build reverse-proxy

      - name: Run health-check scenario
        run: python3 scripts/e2e/health_check.py

      - name: Show container state and logs
        if: failure()
        run: |
          docker compose ps -a
          docker compose logs --no-color

      - name: Stop test stack
        if: always()
        run: docker compose down --volumes --remove-orphans
